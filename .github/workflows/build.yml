name: Build APK

# Builds an installable APK on every push so there's no need to install Android Studio.
# Download it from the run's "Artifacts" section, or from Releases for a tagged build.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compile first and on its own, then re-print just the compiler diagnostics at the
      # very end. Gradle interleaves them with task output and follows them with its own
      # epilogue, so on a failure the "e: file:..." lines are neither first nor last and
      # are genuinely hard to find in the web log viewer.
      - name: Compile
        run: |
          set -o pipefail
          if ! ./gradlew compileDebugKotlin compileDebugUnitTestKotlin 2>&1 | tee compile.log; then
            echo ""
            echo "=================== COMPILER DIAGNOSTICS ==================="
            grep -E '^(e|w): ' compile.log | grep -v 'daemon has terminated' || echo "(none found — see full log above)"
            echo "============================================================"
            exit 1
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          if ! ./gradlew test 2>&1 | tee test.log; then
            echo ""
            echo "===================== FAILING TESTS ========================"
            grep -E 'FAILED|expected:|actual:|AssertionError|Exception' test.log | head -60
            echo "============================================================"
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Name the APK after the commit before it goes anywhere. Android never overwrites a
      # download — it appends (1), (2) and so on — so a Downloads folder ends up holding
      # several files called app-debug.apk that can only be told apart by a timestamp,
      # which is in UTC and therefore reads an hour off in British summer time.
      - name: Name the APK after the commit
        id: naming
        run: |
          mkdir -p dist
          short="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/OpenOBD-${short}.apk"
          echo "short=${short}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Short commit rather than the full forty characters, so the downloaded zip is
          # readable in a phone's file list instead of being elided in the middle.
          name: OpenOBD-${{ steps.naming.outputs.short }}
          path: dist/*.apk
          if-no-files-found: error

      # Tagging a commit v1.0.0 (or similar) publishes the APK as a GitHub Release, which
      # gives a permanent, directly downloadable link — no zip to extract — rather than a
      # 90-day artifact.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
