name: Build APK

# Builds an installable APK on every push so there's no need to install Android Studio.
# Download it from the run's "Artifacts" section, or from Releases for a tagged build.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compile first and on its own. A Kotlin compile error otherwise ends up buried
      # under a few hundred lines of Gradle's own stack trace, which makes the actual
      # "e: file:... " lines nearly impossible to find in the web log viewer.
      - name: Compile
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenOBD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # Tagging a commit v1.0.0 (or similar) publishes the APK as a GitHub Release,
      # which gives a stable download link rather than a 90-day artifact.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
